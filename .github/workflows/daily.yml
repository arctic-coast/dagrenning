# Makes the day's episode and publishes it to GitHub Pages, aiming to have it
# out by 06:30 Iceland time (UTC all year).
#
# GitHub starts scheduled jobs late when it's busy (once by 7.5 hours), so there
# are three triggers: 05:50 is the main one, so a normal delay still lands
# before 06:30; 06:30 and 08:00 are backups. Whichever runs first makes the
# episode and the others see it exists and stop (--skip-if-exists).
name: Daily episode

on:
  schedule:
    - cron: "50 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get the published site (earlier episodes and word history)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
            rm -rf site/.git
          else
            mkdir -p site
          fi
          if [ -f "site/episodes/$(date -u +%F)/script.json" ]; then
            echo "Today's episode is already published."
            echo "ALREADY_DONE=1" >> "$GITHUB_ENV"
          fi

      - uses: astral-sh/setup-uv@v6
        if: env.ALREADY_DONE != '1'

      - name: Make today's episode
        if: env.ALREADY_DONE != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ICEPOD_TTS: elevenlabs
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: eleven_v4
          ICEPOD_EPISODES_DIR: site/episodes
        run: uv run python make_episode.py --skip-if-exists

      - name: Build the podcast feed
        if: env.ALREADY_DONE != '1'
        run: uv run python build_feed.py site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Publish to the gh-pages branch
        if: env.ALREADY_DONE != '1'
        # One fresh commit each day, so the repository doesn't grow with every MP3.
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "dagrenning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Episode $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
