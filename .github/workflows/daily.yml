# Makes the day's episode every morning and publishes it to GitHub Pages.
# Iceland is on UTC all year. GitHub often starts scheduled jobs a little late,
# so this starts at 05:15 to have the episode ready well before 07:00.
name: Daily episode

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get the published site (earlier episodes and word history)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
            rm -rf site/.git
          else
            mkdir -p site
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Make today's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ICEPOD_EPISODES_DIR: site/episodes
        run: uv run python make_episode.py

      - name: Build the podcast feed
        run: uv run python build_feed.py site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Publish to the gh-pages branch
        # One fresh commit each day, so the repository doesn't grow with every MP3.
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "icepod-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Episode $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
